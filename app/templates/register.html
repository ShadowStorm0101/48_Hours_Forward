{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div style="width: 100%; display: flex; justify-content: center;">
  <div style="width: 100%; max-width: 420px; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
    <h2 style="margin-top: 0; text-align: center;">Register</h2>

    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <p>
        <label for="public_username">Username (public)</label><br>
        <input type="text" name="public_username" id="public_username" maxlength="50" autocomplete="username" required
               style="width: 100%; padding: 10px; margin-top: 6px;">
      </p>

      <p>
        <label for="email">Email</label><br>
        <input type="text" name="email" id="email" maxlength="80" autocomplete="email" required
               style="width: 100%; padding: 10px; margin-top: 6px;">
      </p>

      <p>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" autocomplete="new-password" required
               style="width: 100%; padding: 10px; margin-top: 6px;">
      </p>

      <p style="margin-top: 20px;">
        <input type="submit" value="Register"
               style="width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;">
      </p>
    </form>

    <p style="text-align: center; margin-top: 16px;">
      Already have an account?
      <a href="{{ url_for('main.login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
