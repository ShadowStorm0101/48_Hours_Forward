{% extends "base.html" %}
{% block title %}Onboarding{% endblock %}

{% block content %}
<h2>Complete Your Profile</h2>

<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Gender:</label><br>
  <select name="gender" required>
    <option value="">Select</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
  </select><br><br>

  <label>Age:</label><br>
  <input type="range" name="age" min="10" max="80" value="18" oninput="updateAge(this.value)">
  <br>
  <span id="ageValue">18</span> years old
  <br><br>

  <label>Select addictions:</label><br>

  <input type="checkbox" name="alcohol" value="alcohol"> Alcohol<br>
  <input type="checkbox" name="nicotine" value="smoking"> Smoking<br>
  <input type="checkbox" name="narcotics" value="narcotics"> Narcotics<br><br>

  <button>Finish</button>
</form>

<script>
function updateAge(val) {
    document.getElementById("ageValue").textContent = val;
}
</script>

<style>
input[type="range"] {
    width: 250px;
    margin-top: 10px;
}
</style>

{% endblock %}
