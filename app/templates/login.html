{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="width: 100%; display: flex; justify-content: center;">
  <div style="width: 100%; max-width: 420px; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
    <h2 style="margin-top: 0; text-align: center;">Login</h2>

    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <p>
        <label for="email">Email</label><br>
        <input type="text" name="email" id="email" autocomplete="email" required
               style="width: 100%; padding: 10px; margin-top: 6px;">
      </p>

      <p>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" autocomplete="current-password" required
               style="width: 100%; padding: 10px; margin-top: 6px;">
      </p>

      <p style="margin-top: 20px;">
        <input type="submit" value="Login"
               style="width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;">
      </p>
    </form>

    <p style="text-align: center; margin-top: 16px;">
      Don’t have an account?
      <a href="{{ url_for('main.register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
