{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h2>Welcome, {{ user.username }}</h2>

{% if role == "moderator" and stats %}
<h3>Moderator Analytics</h3>

<div class="pie-row">
    <div class="pie-card">
        <canvas id="genderChart"></canvas>
        <div class="pie-label">Gender</div>
    </div>

    <div class="pie-card">
        <canvas id="ageChart"></canvas>
        <div class="pie-label">Age</div>
    </div>

    <div class="pie-card">
        <canvas id="addictionChart"></canvas>
        <div class="pie-label">Substance</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const stats = {{ stats | tojson }};

// Gender Pie
new Chart(document.getElementById("genderChart"), {
    type: "pie",
    data: {
        labels: ["Male", "Female", "Other"],
        datasets: [{
            data: [
                stats.gender.male || 0,
                stats.gender.female || 0,
                stats.gender.other || 0
            ]
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false }
        }
    }
});

// Age Pie
new Chart(document.getElementById("ageChart"), {
    type: "pie",
    data: {
        labels: ["Under 18", "18-25", "26-40", "40+"],
        datasets: [{
            data: [
                stats.age_groups.under_18 || 0,
                stats.age_groups["18_25"] || 0,
                stats.age_groups["26_40"] || 0,
                stats.age_groups["40_plus"] || 0
            ]
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false }
        }
    }
});

// Addictions Pie (kept as pie for consistent design)
new Chart(document.getElementById("addictionChart"), {
    type: "pie",
    data: {
        labels: ["Alcohol", "Smoking", "Narcotics"],
        datasets: [{
            data: [
                stats.addictions.alcohol || 0,
                stats.addictions.smoking || 0,
                stats.addictions.narcotics || 0
            ]
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false }
        }
    }
});
</script>

<style>
.pie-row {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul>
      {% for category, message in messages %}
        <li style="color: {{ 'red' if category == 'error' else 'green' }};">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}


  <div class="dashboard-box">

    <div class="habit-card-container">

      {% if user.alcohol_streak_start is not none %}
        <div class="habit-card">
          <div class="habit-title">Alcohol</div>

          <div class="streak-box">
            <span
              class="live-streak"
              data-start="{{ user.alcohol_streak_start.isoformat() }}Z"
            ></span>
          </div>

          <div class="milestone-box">
            <p>{{ alcohol_milestone_message }}</p>
          </div>

          <form method="POST" action="{{ url_for('main.reset_habit', habit='alcohol') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <button
              class="reset-button"
              type="submit"
              onclick="return confirm('Reset Alcohol streak?')"
            >
              Reset
            </button>
          </form>
        </div>
      {% endif %}

      {% if user.nicotine_streak_start is not none %}
        <div class="habit-card">
          <div class="habit-title">Nicotine</div>

          <div class="streak-box">
            <span
              class="live-streak"
              data-start="{{ user.nicotine_streak_start.isoformat() }}Z"
            ></span>
          </div>

          <div class="milestone-box">
            <p>{{ nicotine_milestone_message }}</p>
          </div>

          <form method="POST" action="{{ url_for('main.reset_habit', habit='nicotine') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <button
              class="reset-button"
              type="submit"
              onclick="return confirm('Reset Nicotine streak?')"
            >
              Reset
            </button>
          </form>
        </div>
      {% endif %}

      {% if user.narcotics_streak_start is not none %}
        <div class="habit-card">
          <div class="habit-title">Narcotics</div>

          <div class="streak-box">
            <span
              class="live-streak"
              data-start="{{ user.narcotics_streak_start.isoformat() }}Z"
            ></span>
          </div>

          <div class="milestone-box">
            <p>{{ narcotics_milestone_message }}</p>
          </div>

          <form method="POST" action="{{ url_for('main.reset_habit', habit='narcotics') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <button
              class="reset-button"
              type="submit"
              onclick="return confirm('Reset Narcotics streak?')"
            >
              Reset
            </button>
          </form>
        </div>
      {% endif %}

    </div>

  </div>

  <script>
    function formatDelta(milliseconds) {
      let totalSeconds = Math.floor(milliseconds / 1000);

      let days = Math.floor(totalSeconds / 86400);
      totalSeconds %= 86400;

      let hours = Math.floor(totalSeconds / 3600);
      totalSeconds %= 3600;

      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;

    if (days > 30) {
     return `${days} days\n${hours} hours\n${minutes} minutes\n${seconds} seconds`;
    }

    if (days > 0) {
      return `${days} days\n${hours} hours\n${minutes} minutes\n${seconds} seconds`;
    }

    if (hours > 0) {
      return `${hours} hours\n${minutes} minutes\n${seconds} seconds`;
    }

    if (minutes > 0) {
      return `${minutes} minutes\n${seconds} seconds`;
    }

    return `${seconds} seconds`;
    }

    function updateStreaks() {
      const streakElements = document.querySelectorAll(".live-streak");

      streakElements.forEach(function(element) {
        const startTime = new Date(element.dataset.start);
        const now = new Date();
        const difference = now - startTime;

        element.textContent = formatDelta(difference);
      });
    }

    updateStreaks();
    setInterval(updateStreaks, 1000);
  </script>
{% endif %}

{% endblock %}
