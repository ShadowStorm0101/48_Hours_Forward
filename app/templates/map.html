{% extends "base.html"%}

{% block head %}
<link rel="stylesheet" href="../static/map.css">
{% endblock %}

{% block title %}Map{% endblock %}

{% block content %}
<h1 class="page-title" >Map</h1>



{% if user.role == "admin" %}
  <div id="add-location-form">
  <h3>Add New Location</h3>

  <form method="POST" action="{{ url_for('main.add_location') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input type="text" name="name" placeholder="Location name" required>

    <input type="number" step="any" name="lat" placeholder="Latitude" required>
    <input type="number" step="any" name="lng" placeholder="Longitude" required>

    <select name="day" required>
      <option value="">Select day</option>
      <option value="0">Monday</option>
      <option value="1">Tuesday</option>
      <option value="2">Wednesday</option>
      <option value="3">Thursday</option>
      <option value="4">Friday</option>
      <option value="5">Saturday</option>
      <option value="6">Sunday</option>
    </select>

    <input type="time" name="time" required>

    <label><input type="checkbox" name="is_alcohol"> 🍺 Alcohol</label>
    <label><input type="checkbox" name="is_narcotics"> 💊 Narcotics</label>
    <label><input type="checkbox" name="is_nicotine"> 🚬 Nicotine</label>

    <button type="submit">Add Location</button>
  </form>
  </div>
{% endif %}








<div id="map_flex_div">
  <div id="map_div">
      <div id="map"></div>
      <button onclick="recenter()">Recenter</button>
      <button onclick="searchArea()">Search this area</button>
  </div>

  <div id="map_services_frame">
      <h3 id="map_services_header">Nearby Addiction Services</h3>
      {% for place in places %}
      <button class="services_button"
          onclick="focusPlace({{ place.lat }}, {{ place.lng }})">

        <div class="services-name">
            <strong>{{ place.name }}</strong><br>
        </div>

        <div class="services-details">
            {{ "%.2f"|format(place.distance_km) }} km<br>
            <div class="services-addiction-type">
            {% if place.is_alcohol %} 🍺 {% endif %}
            {% if place.is_narcotics %} 💊 {% endif %}
            {% if place.is_nicotine %} 🚬 {% endif %}
            </div>
        </div>

      </button>
      {% endfor %}
  </div>
</div>

<style>
</style>

<script src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key }}"></script>

<script>
const places = {{ places | tojson }};

let map;
let markers = [];
let centerMarker = null;

function initMap(centerLat, centerLng, zoom = 12) {
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: zoom,
        streetViewControl: false,
        mapTypeControl: false,
        center: { lat: centerLat, lng: centerLng }
    });

    places.forEach(place => {
        const marker = new google.maps.Marker({
            position: { lat: jitter(place.lat), lng: jitter(place.lng) },
            map: map,
            title: place.name,
        });

        const info = new google.maps.InfoWindow({
            content: `<strong>${place.name}</strong> <br> Every ${place.day} at ${place.time}`
        });

        marker.addListener("click", () => info.open(map, marker));
        markers.push(marker);
    });

    updateCenterMarker();
}

function jitter(coord) {
    return coord + (Math.random() - 0.5) * 0.0002;
}

function updateCenterMarker() {
    if (!map) return;

    const center = map.getCenter();

    // remove old marker
    if (centerMarker) {
        centerMarker.setMap(null);
    }

    centerMarker = new google.maps.Marker({
        position: center,
        map: map,
        title: "Search Center",
        icon: {
            url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        }
    });
}

function focusPlace(lat, lng) {
    map.panTo({ lat, lng });
    map.setZoom(22);
}

function loadMap() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;

                window.location.href = `/map?lat=${lat}&lng=${lng}`;
            },
            () => initMap(54.9783, -1.6178) //newcastle city centre fall back
        );
    } else {
        initMap(54.9783, -1.6178); //newcastle city centre fall back
    }
}

function searchArea(){
    if (!map) return;

    const center = map.getCenter();
    const lat = center.lat();
    const lng = center.lng();
    const zoom = map.getZoom();

    // reload page with new coords
    window.location.href = `/map?lat=${lat}&lng=${lng}&zoom=${zoom}`;
}

function recenter(){
    if (!map || !centerMarker) return;

    const pos = centerMarker.getPosition(); // google.maps.LatLng
    map.panTo(pos);
}

const urlParams = new URLSearchParams(window.location.search);

if (urlParams.has("lat") && urlParams.has("lng")) {
    const lat = parseFloat(urlParams.get("lat"));
    const lng = parseFloat(urlParams.get("lng"));
    const zoom = parseInt(urlParams.get("zoom")) || 12;
    initMap(lat, lng, zoom);
} else {
    loadMap(); // fallback to geolocation
}
</script>
{% endblock %}
